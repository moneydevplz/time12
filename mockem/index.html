<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#3b3355; --muted:#7c7596;
  --pink:#ff7a8a; --orange:#ffa94d; --yellow:#f6d33c; --green:#4cc16f; --blue:#4dabf7; --purple:#9775fa;
  --pink-f:#ffe0e5; --orange-f:#ffeacc; --yellow-f:#fff6bd; --green-f:#d9f6e2; --blue-f:#d8edff; --purple-f:#e8dffd;
  --err:#d6336c; --ok:#2f9e57;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --wob1:255px 18px 225px 20px/20px 225px 18px 255px;
  --wob2:18px 200px 22px 240px/240px 20px 200px 18px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.45 var(--font);background:var(--paper) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22960%22%20height%3D%22760%22%20viewBox%3D%220%200%20960%20760%22%3E%3Ccircle%20cx%3D%2280%22%20cy%3D%2290%22%20r%3D%2262%22%20fill%3D%22%23ffb3c1%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23ffb3c1%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22300%22%20cy%3D%2240%22%20r%3D%2238%22%20fill%3D%22%23b8f0c8%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23b8f0c8%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22520%22%20cy%3D%22130%22%20r%3D%2280%22%20fill%3D%22%23a8dcff%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23a8dcff%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22760%22%20cy%3D%2270%22%20r%3D%2246%22%20fill%3D%22%23ffd6a5%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23ffd6a5%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22170%22%20cy%3D%22300%22%20r%3D%2234%22%20fill%3D%22%23fdf2a0%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23fdf2a0%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22380%22%20cy%3D%22260%22%20r%3D%2258%22%20fill%3D%22%23d4c1ff%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23d4c1ff%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22640%22%20cy%3D%22330%22%20r%3D%2240%22%20fill%3D%22%23ffb3c1%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23ffb3c1%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22840%22%20cy%3D%22280%22%20r%3D%2266%22%20fill%3D%22%23fdf2a0%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23fdf2a0%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%22500%22%20r%3D%2270%22%20fill%3D%22%23a8dcff%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23a8dcff%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22260%22%20cy%3D%22560%22%20r%3D%2244%22%20fill%3D%22%23ffd6a5%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23ffd6a5%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22470%22%20cy%3D%22470%22%20r%3D%2236%22%20fill%3D%22%23b8f0c8%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23b8f0c8%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22560%22%20cy%3D%22610%22%20r%3D%2270%22%20fill%3D%22%23d4c1ff%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23d4c1ff%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22760%22%20cy%3D%22520%22%20r%3D%2242%22%20fill%3D%22%23a8dcff%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23a8dcff%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22880%22%20cy%3D%22640%22%20r%3D%2234%22%20fill%3D%22%23ffb3c1%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23ffb3c1%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%22680%22%20r%3D%2230%22%20fill%3D%22%23fdf2a0%22%20fill-opacity%3D%22.62%22%20stroke%3D%22%23fdf2a0%22%20stroke-width%3D%223%22%20stroke-dasharray%3D%222%205%22%20stroke-opacity%3D%22.9%22/%3E%3C/svg%3E") 0 0/960px 760px;color:var(--ink)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
.pencil{filter:url(#pencil)}

/* shared sketchy pieces */
.btn,input[type=text],input[type=password],.box,.addroom input,#rooms button[aria-current=true],.av,.card{filter:url(#pencil)}
.btn{background:var(--pink-f);border:3px solid var(--pink);border-radius:var(--wob1);padding:10px 20px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--pink);transition:transform .08s}
.btn:hover:not(:disabled){transform:rotate(-1.5deg) scale(1.03)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pink)}
.btn:disabled{opacity:.55;cursor:default}
input[type=text],input[type=password]{width:100%;padding:10px 14px;background:#fff;border:3px solid var(--blue);border-radius:var(--wob2)}
input[type=password]{border-color:var(--green)}
input:focus{background:var(--yellow-f)}
label{display:block;font-weight:700;margin-bottom:5px}
.msg-line{min-height:1.3em;font-size:.9rem;margin:0}
.msg-line.error{color:var(--err);font-weight:700}.msg-line.ok{color:var(--ok)}

/* sign in */
#login{min-height:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.login-side{padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-side .mark{font-size:3rem;font-weight:700;color:var(--pink);transform:rotate(-3deg);text-shadow:3px 3px 0 var(--yellow);align-self:flex-start}
.login-side p{max-width:14ch;font-size:2rem;line-height:1.15;font-weight:700;margin:0;transform:rotate(1deg)}
.login-side small{color:var(--muted)}
.login-main{display:flex;align-items:center;justify-content:center;padding:32px}
.card{width:100%;max-width:380px;background:#fff;border:3px solid var(--purple);border-radius:var(--wob1);padding:30px 28px;box-shadow:5px 5px 0 var(--purple-f)}
.card form{display:flex;flex-direction:column;gap:16px}
.card h1{font-size:2rem;margin:0 0 4px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%228%22%20viewBox%3D%220%200%2040%208%22%3E%3Cpath%20d%3D%22M0%204%20Q5%200%2010%204%20T20%204%20T30%204%20T40%204%22%20fill%3D%22none%22%20stroke%3D%22%23ff7a8a%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E") repeat-x left bottom;padding-bottom:10px;display:inline-block}
.card .sub{margin:6px 0 0;color:var(--muted)}

/* app */
#app{display:none;height:100%;grid-template-columns:250px minmax(0,1fr)}
aside{display:flex;flex-direction:column;min-height:0;border-right:3px dashed var(--orange);background:rgba(255,255,255,.7)}
aside .top{padding:18px 18px 6px;font-size:1.9rem;font-weight:700;color:var(--pink);text-shadow:2px 2px 0 var(--yellow);transform:rotate(-2deg)}
.org{margin:0 18px;font-weight:700;color:var(--muted);font-size:.9rem}
aside h2{font-size:.9rem;color:var(--muted);margin:12px 18px 6px}
#rooms{list-style:none;margin:0;padding:0 10px;flex:1;overflow-y:auto}
#rooms button{width:100%;text-align:left;background:none;border:0;padding:7px 12px;border-radius:12px;cursor:pointer;font-weight:700}
#rooms button:hover{background:var(--blue-f)}
#rooms button[aria-current=true]{background:var(--yellow-f);border:3px solid var(--yellow);border-radius:var(--wob2);padding:4px 10px}
.addroom{padding:10px 12px}
.addroom input{border-color:var(--orange);padding:7px 12px;font-size:.9rem}
.me{padding:12px 18px;display:flex;align-items:center;gap:10px;border-top:3px dashed var(--blue)}
.me span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.me button{background:none;border:0;cursor:pointer;color:var(--err);text-decoration:underline wavy;font-size:.85rem}

main{display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(255,255,255,.7);border-bottom:3px dashed var(--green)}
.bar h1{font-size:1.4rem;margin:0;flex:1}
.conn{font-size:.85rem;color:var(--muted);font-weight:700}
.conn.live{color:var(--ok)}.conn.bad{color:var(--err)}
#list{flex:1;overflow-y:auto;padding:10px 0}
.row{--h:280;display:grid;grid-template-columns:42px 1fr;gap:12px;padding:3px 24px}
.row.head{margin-top:12px}
.av{width:42px;height:42px;border-radius:50%;background:hsl(var(--h) 90% 85%);border:3px solid hsl(var(--h) 75% 62%);display:flex;align-items:center;justify-content:center;font-weight:700;color:hsl(var(--h) 55% 30%);margin-top:2px}
.row.cont .av{visibility:hidden;height:0}
.bubble{display:inline-block;max-width:100%}
.meta{display:flex;gap:8px;align-items:baseline}
.meta b{color:hsl(var(--h) 65% 38%)}.meta time{font-size:.78rem;color:var(--muted)}
.text{white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(255,255,255,.88);display:inline-block;padding:2px 8px;margin-left:-8px;border-radius:10px}
.empty{margin:48px auto;color:var(--ink);text-align:center;max-width:30ch;font-size:1.2rem;font-weight:700;background:rgba(255,255,255,.9);padding:14px;border-radius:var(--wob1);border:3px dashed var(--pink)}
form.send{padding:12px 24px 20px}
form.send .box{display:flex;gap:10px;background:#fff;border:3px solid var(--purple);border-radius:var(--wob2);padding:6px 6px 6px 16px}
form.send input{flex:1;border:0;background:transparent;padding:6px 0;outline:none}
form.send .box:focus-within{background:var(--yellow-f)}
form.send .btn{padding:7px 18px;background:var(--green-f);border-color:var(--green);box-shadow:3px 3px 0 var(--green)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover:not(:disabled){transform:none}}
@media (max-width:760px){
  #login{grid-template-columns:1fr}.login-side{display:none}
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  aside{max-height:38vh;border-right:0;border-bottom:3px dashed var(--orange)}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="pencil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter></svg>

<div id="login">
  <div class="login-side">
    <div class="mark">Mockem</div>
    <p>Chat with your people.</p>
    <small>Chats stay inside your organization.</small>
  </div>
  <div class="login-main">
    <div class="card"><form id="authForm" autocomplete="on">
      <div>
        <h1>Hop in</h1>
        <p class="sub">Use your UniClvrPass account to open Mockem.</p>
      </div>
      <div><label for="u">Username</label><input type="text" id="u" autocomplete="username" required></div>
      <div><label for="p">Password</label><input type="password" id="p" autocomplete="current-password" required></div>
      <p class="msg-line" id="loginMsg" role="alert"></p>
      <button class="btn" id="loginBtn" type="submit">Sign in with UniClvrPass</button>
    </form></div>
  </div>
</div>

<div id="app">
  <aside>
    <div class="top">Mockem</div>
    <div class="org" id="orgName"></div>
    <h2>Rooms</h2>
    <ul id="rooms"></ul>
    <form class="addroom" id="addRoom"><input id="newRoom" maxlength="40" placeholder="Add a room" aria-label="Add a room"></form>
    <div class="me"><span id="meName"></span><button id="logout" type="button">Sign out</button></div>
  </aside>
  <main>
    <div class="bar"><h1 id="roomTitle"></h1><span class="conn" id="conn">Connecting…</span></div>
    <div id="list" aria-live="polite"></div>
    <form class="send" id="send">
      <div class="box">
        <input id="text" maxlength="1000" placeholder="Type a message" autocomplete="off" aria-label="Message">
        <button class="btn" id="sendBtn" type="submit">Send</button>
      </div>
    </form>
  </main>
</div>

<script>
const AUTH_URL = 'https://lbujqhnadkwqgojbhalw.supabase.co/functions/v1/auth';
const CHAT_URL = 'https://vbdmenslbebogqbfdlmz.supabase.co/functions/v1/chat';
const $ = id => document.getElementById(id);

/* ---- session (same keys as other UniClvrPass pages) ---- */
function getSession(){
  try{
    const userId=localStorage.getItem('userId'), username=localStorage.getItem('username'), authToken=localStorage.getItem('authToken');
    if(userId&&username&&authToken) return {userId,username,authToken};
  }catch(e){}
  return null;
}
function setSession(d){ try{ localStorage.setItem('userId',d.userId); localStorage.setItem('username',d.username); localStorage.setItem('authToken',d.token);}catch(e){} }
function clearSession(){ try{ ['userId','username','authToken'].forEach(k=>localStorage.removeItem(k)); }catch(e){} }

/* ---- chat API: the server verifies the token and decides your org ---- */
class AuthError extends Error{}
async function api(body){
  const s=getSession(); if(!s) throw new AuthError('Not signed in');
  const r=await fetch(CHAT_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.authToken},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401) throw new AuthError(d.error||'Your session has expired. Sign in again.');
  if(!r.ok) throw new Error(d.error||'Something went wrong.');
  return d;
}

/* ---- sign in ---- */
function loginMsg(t,k){ $('loginMsg').textContent=t; $('loginMsg').className='msg-line '+(k||''); }
$('authForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const username=$('u').value.trim(), password=$('p').value;
  if(!username||!password){ loginMsg('Enter your username and password.','error'); return; }
  $('loginBtn').disabled=true; loginMsg('Signing in…');
  try{
    const r=await fetch(AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.success){ loginMsg(d.error||'Sign-in failed. Check your details and try again.','error'); return; }
    setSession(d); $('p').value=''; loginMsg('');
    enterApp();
  }catch(err){ loginMsg('Could not reach UniClvrPass. Check your connection.','error'); }
  finally{ $('loginBtn').disabled=false; }
});

/* ---- app state ---- */
let me=null, org='', room='general', seen=new Set(), lastRow=null, lastId=0, timer=null, openToken=0;
const shown = u => u.split('@')[0];
const roomKey = () => 'rooms:'+org;
function localRooms(){ try{ const r=JSON.parse(localStorage.getItem(roomKey())||'[]'); if(Array.isArray(r)) return r; }catch(e){} return []; }
function saveRooms(r){ try{ localStorage.setItem(roomKey(),JSON.stringify(r)); }catch(e){} }
let rooms=['general'];
function mergeRooms(extra){ rooms=[...new Set(['general',...localRooms(),...extra])]; saveRooms(rooms); }

function setConn(k,t){ $('conn').className='conn '+k; $('conn').textContent=t; }

async function enterApp(){
  me=getSession(); if(!me) return showLogin();
  $('login').style.display='none'; $('app').style.display='grid';
  $('meName').textContent=shown(me.username);
  setConn('','Connecting…');
  try{
    const info=await api({action:'me'});
    org=info.org; $('orgName').textContent=org;
    mergeRooms([]); drawRooms();
    api({action:'rooms'}).then(r=>{ mergeRooms(r.rooms||[]); drawRooms(); }).catch(()=>{});
    openRoom(rooms[0]);
  }catch(err){ handleErr(err); }
}
function showLogin(msg){
  stopPoll();
  $('app').style.display='none'; $('login').style.display='';
  if(msg) loginMsg(msg,'error');
  setTimeout(()=>$('u').focus(),50);
}
function handleErr(err){
  if(err instanceof AuthError){ clearSession(); me=null; showLogin(err.message); }
  else setConn('bad','Offline');
}
$('logout').onclick=()=>{ clearSession(); me=null; loginMsg(''); showLogin(); };

function drawRooms(){
  const ul=$('rooms'); ul.innerHTML='';
  rooms.forEach(r=>{
    const li=document.createElement('li'), b=document.createElement('button');
    b.textContent='# '+r; b.type='button';
    if(r===room) b.setAttribute('aria-current','true');
    b.onclick=()=>openRoom(r);
    li.appendChild(b); ul.appendChild(li);
  });
}
$('addRoom').addEventListener('submit',e=>{
  e.preventDefault();
  const n=$('newRoom').value.trim().toLowerCase().replace(/[^a-z0-9_ -]/g,'').replace(/\s+/g,'-').slice(0,40);
  if(!n) return;
  mergeRooms([n]); $('newRoom').value=''; openRoom(n);
});

function render(m){
  if(seen.has(m.id)) return; seen.add(m.id); if(m.id>lastId) lastId=m.id;
  const list=$('list'); const em=list.querySelector('.empty'); if(em) em.remove();
  const t=new Date(m.created_at), name=shown(m.username);
  const cont=lastRow&&lastRow.user===m.username&&(t-lastRow.time)<5*60*1000;
  const row=document.createElement('div'); row.className='row '+(cont?'cont':'head');
  let h=0; for(const c of m.username) h=(h*31+c.charCodeAt(0))%360; row.style.setProperty('--h',h);
  const av=document.createElement('div'); av.className='av'; av.textContent=name.charAt(0).toUpperCase();
  const body=document.createElement('div');
  if(!cont){
    const meta=document.createElement('div'); meta.className='meta';
    const n=document.createElement('b'); n.textContent=name;
    const tm=document.createElement('time'); tm.textContent=t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    meta.append(n,tm); body.appendChild(meta);
  }
  const tx=document.createElement('div'); tx.className='text'; tx.textContent=m.body; body.appendChild(tx);
  row.append(av,body);
  const near=list.scrollHeight-list.scrollTop-list.clientHeight<100;
  list.appendChild(row); lastRow={user:m.username,time:t};
  if(near||m.username===me.username) list.scrollTop=list.scrollHeight;
}

function stopPoll(){ if(timer){ clearInterval(timer); timer=null; } }
async function poll(tok){
  if(document.hidden||tok!==openToken) return;
  try{
    const d=await api({action:'history',room,afterId:lastId});
    if(tok!==openToken) return;
    (d.messages||[]).forEach(render); setConn('live','Live');
  }catch(err){ handleErr(err); }
}

async function openRoom(r){
  stopPoll(); const tok=++openToken;
  room=r; seen=new Set(); lastRow=null; lastId=0;
  drawRooms(); $('roomTitle').textContent='# '+room;
  const list=$('list'); list.innerHTML=''; setConn('','Connecting…');
  try{
    const d=await api({action:'history',room});
    if(tok!==openToken) return;
    if(!d.messages.length) list.innerHTML='<p class="empty">Nobody has said anything yet. Go first!</p>';
    d.messages.forEach(render); list.scrollTop=list.scrollHeight; setConn('live','Live');
    timer=setInterval(()=>poll(tok),2500);
  }catch(err){ handleErr(err); if(!(err instanceof AuthError)) list.innerHTML='<p class="empty">Messages could not be loaded. Check your connection and reopen the room.</p>'; }
  $('text').focus();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&me) poll(openToken); });

$('send').addEventListener('submit',async e=>{
  e.preventDefault();
  const body=$('text').value.trim(); if(!body||!me) return;
  $('sendBtn').disabled=true;
  try{
    const d=await api({action:'send',room,body});
    const em=$('list').querySelector('.empty'); if(em) em.remove();
    render(d.message); $('text').value='';
  }catch(err){ if(err instanceof AuthError) handleErr(err); else setConn('bad',err.message||'Message not sent'); }
  finally{ $('sendBtn').disabled=false; $('text').focus(); }
});

if(getSession()) enterApp(); else showLogin();
